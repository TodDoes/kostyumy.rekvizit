<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Костюмы.Реквизит</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-800"><header class="bg-white border-b sticky top-0 z-20"><div class="max-w-7xl mx-auto h-16 px-4 flex gap-4 items-center"><button onclick="go('catalog')" class="font-bold text-brand-700">🎭 Костюмы.Реквизит</button><input id="q" oninput="later(loadCatalog)" class="flex-1 control" placeholder="Поиск: название, стиль, материал"><button id="add" onclick="go('create')" class="hidden primary">+ Объявление</button><button id="auth" onclick="openAuth()" class="secondary">Войти</button></div></header>
<div class="max-w-7xl mx-auto flex gap-6 p-4"><aside class="hidden md:block w-52"><div class="panel space-y-1"><button class="nav" onclick="go('catalog')">Каталог</button><button class="nav logged hidden" onclick="go('create')">Создать</button><button class="nav logged hidden" onclick="go('my')">Мои объявления</button><button class="nav logged hidden" onclick="go('requests')">Заявки и сделки</button><button class="nav logged hidden" onclick="go('favorites')">Избранное</button><button id="admin-nav" class="nav hidden" onclick="go('moderation')">Модерация</button></div><p id="user" class="text-xs text-slate-500 p-2"></p></aside><main class="flex-1 min-w-0">
<section id="catalog-view" class="view"><div class="rounded-2xl bg-slate-800 text-white p-6 mb-4"><h1 class="text-2xl font-bold">Реквизит для сцены</h1><p class="text-slate-300 mt-1">Точный поиск по ткани, цвету, меркам и эпохе.</p></div><div class="panel grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-2 mb-4"><select id="category" class="filter"><option value="">Категория</option><option>Костюмы</option><option>Обувь</option><option>Головные уборы</option><option>Аксессуары</option><option>Бутафория</option></select><input id="color" class="filter" placeholder="Цвет"><input id="material" class="filter" placeholder="Материал"><input id="size" class="filter" placeholder="Размер"><input id="style" class="filter" placeholder="Эпоха"><select id="condition" class="filter"><option value="">Состояние</option><option>Отличное</option><option>Хорошее</option><option>Удовлетворительное</option></select><select id="transfer_type" class="filter"><option value="">Сделка</option><option>Аренда</option><option>Продажа</option></select><button class="text-sm text-brand-700" onclick="resetFilters()">Сбросить</button></div><div class="flex justify-between mb-3"><b>Каталог</b><span id="count" class="text-sm text-slate-500"></span></div><div id="grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></section>
<section id="detail-view" class="view hidden"></section>
<section id="create-view" class="view hidden max-w-3xl"><div class="panel"><h1 class="text-xl font-bold">Новое объявление</h1><p class="muted">После загрузки фотографии карточка будет отправлена модератору.</p><form id="item-form" onsubmit="createItem(event)" class="form-grid mt-4"><label>Название *<input name="title" required></label><label>Категория *<select name="category" required><option value="">Выберите</option><option>Костюмы</option><option>Обувь</option><option>Головные уборы</option><option>Аксессуары</option><option>Бутафория</option></select></label><label>Цвет *<input name="color" required></label><label>Материал *<input name="material" required placeholder="Бархат, парча, хлопок"></label><label>Размер *<input name="size" required></label><label>Эпоха / стиль *<input name="style" required></label><label>Состояние *<select name="condition" required><option value="">Выберите</option><option>Отличное</option><option>Хорошее</option><option>Удовлетворительное</option></select></label><label>Тип сделки *<select name="transfer_type" required><option value="">Выберите</option><option>Аренда</option><option>Продажа</option></select></label><label>Цена *<input name="price" type="number" min="0" required></label><label>Фото *<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required></label><label class="wide">Мерки / размеры *<textarea name="measurements" required placeholder="Обхват груди, длина по спине, рост"></textarea></label><label class="wide">Описание<textarea name="description"></textarea></label><label class="wide">Дефекты<textarea name="defects">Нет</textarea></label><button class="wide primary py-3">Отправить на модерацию</button></form></div></section>
<section id="my-view" class="view hidden"><h1 class="title">Мои объявления</h1><div id="my-list" class="space-y-3"></div></section><section id="favorites-view" class="view hidden"><h1 class="title">Избранное</h1><div id="favorites-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div></section><section id="requests-view" class="view hidden"><h1 class="title">Заявки и сделки</h1><div id="requests-list" class="space-y-3"></div></section><section id="moderation-view" class="view hidden"><h1 class="title">Модерация новых объявлений</h1><div id="moderation-list" class="space-y-3"></div></section>
</main></div>
<div id="auth-modal" class="modal hidden"><div class="modal-card"><button class="float-right" onclick="closeModal('auth-modal')">×</button><h2 class="font-bold text-lg">Вход и регистрация</h2><div class="flex gap-2 mt-3"><button onclick="authMode('login')" class="secondary">Войти</button><button onclick="authMode('register')" class="secondary">Регистрация</button></div><form id="auth-form" onsubmit="submitAuth(event)" class="space-y-3 mt-4"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" minlength="8" required placeholder="Пароль"><input id="name" name="name" placeholder="Имя" required><button class="primary w-full">Продолжить</button></form></div></div><div id="chat-modal" class="modal hidden"><div class="modal-card"><button class="float-right" onclick="closeModal('chat-modal')">×</button><h2 class="font-bold">Переписка по заявке</h2><div id="messages" class="h-64 overflow-auto my-3 space-y-2"></div><form onsubmit="sendMessage(event)" class="flex gap-2"><input id="message" required placeholder="Сообщение"><button class="primary">Отправить</button></form></div></div><div id="toast" class="hidden fixed bottom-4 right-4 bg-slate-900 text-white p-3 rounded-xl"></div>
<script>
const S={token:localStorage.token,user:null,item:null,request:null,mode:'login',t:null},$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){let h={...(o.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;if(o.body&&!(o.body instanceof FormData))h['Content-Type']='application/json';let r=await fetch('/api'+u,{...o,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка сервера');return d}function say(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}function go(n){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(n+'-view').classList.remove('hidden');({catalog:loadCatalog,my:loadMy,favorites:loadFavorites,requests:loadRequests,moderation:loadModeration}[n]||(()=>{}))()}
function later(f){clearTimeout(S.t);S.t=setTimeout(f,250)}document.querySelectorAll('.filter').forEach(x=>x.oninput=()=>later(loadCatalog));function resetFilters(){document.querySelectorAll('.filter').forEach(x=>x.value='');$('q').value='';loadCatalog()}function img(i){return i.photos[0]||'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80'}function card(i){return `<article class="card"><img src="${esc(img(i))}" alt="${esc(i.title)}"><div class="p-4"><small>${esc(i.category)} · ${esc(i.color)}</small><h3 class="font-bold">${esc(i.title)}</h3><p class="muted">${esc(i.material)} · ${esc(i.size)} · ${esc(i.style)}</p><div class="flex justify-between mt-3"><b>${Number(i.price).toLocaleString('ru-RU')} ₽</b><button class="text-brand-700" onclick="showItem('${i.id}')">Подробнее</button></div></div></article>`}
async function loadCatalog(){try{let p=new URLSearchParams({per_page:20});['category','color','material','size','style','condition','transfer_type'].forEach(k=>$(k).value&&p.set(k,$(k).value));$('q').value&&p.set('q',$('q').value);let a=await api('/items?'+p);$('count').textContent='Найдено: '+a.length;$('grid').innerHTML=a.map(card).join('')||'<p class="muted">Ничего не найдено.</p>'}catch(e){say(e.message)}}
async function showItem(id){try{let i=S.item=await api('/items/'+id);$('detail-view').innerHTML=`<button class="text-brand-700 text-sm" onclick="go('catalog')">← Каталог</button><div class="grid md:grid-cols-2 gap-6 mt-4"><img class="w-full h-96 object-cover rounded-2xl" src="${esc(img(i))}"><div><small>${esc(i.category)} · ${esc(i.transfer_type)}</small><h1 class="text-2xl font-bold">${esc(i.title)}</h1><b class="text-xl block mt-4">${Number(i.price).toLocaleString('ru-RU')} ₽</b><p class="muted mt-2">Владелец: ${esc(i.owner.name)}</p><button class="primary mt-5" onclick="requestItem()">Оставить заявку</button><button class="secondary" onclick="favorite('${i.id}')">☆ В избранное</button></div></div><div class="panel mt-5"><div class="flex gap-4 border-b pb-3"><button onclick="tab('desc')">Описание</button><button onclick="tab('specs')">Мерки и характеристики</button><button onclick="tab('history')">История</button></div><div id="tab" class="pt-4"></div></div>`;tab('desc');go('detail')}catch(e){say(e.message)}}
async function tab(t){let i=S.item;if(t==='desc')$('tab').innerHTML=`<p>${esc(i.description||'Описание не добавлено.')}</p><p class="muted mt-3">Дефекты: ${esc(i.defects||'не указаны')}</p>`;if(t==='specs')$('tab').innerHTML=`<dl class="specs"><dt>Цвет</dt><dd>${esc(i.color)}</dd><dt>Материал</dt><dd>${esc(i.material)}</dd><dt>Размер</dt><dd>${esc(i.size)}</dd><dt>Эпоха</dt><dd>${esc(i.style)}</dd><dt>Состояние</dt><dd>${esc(i.condition)}</dd><dt>Мерки</dt><dd>${esc(i.measurements)}</dd></dl>`;if(t==='history'){let h=await api('/items/'+i.id+'/history');$('tab').innerHTML=h.map(x=>`<p class="border-l-2 border-slate-700 pl-3 mb-3"><b>${esc(x.action)}</b> — ${esc(x.description)}<br><small>${new Date(x.created_at).toLocaleString('ru-RU')}</small></p>`).join('')}}
async function createItem(e){e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));d.price=+d.price;let i=await api('/items',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(d)}),f=$('photos').files;if(!f.length||f.length>8)throw Error('Выберите от 1 до 8 фотографий');let fd=new FormData;[...f].forEach(x=>fd.append('files',x));await api('/items/'+i.id+'/photos',{method:'POST',body:fd});await api('/items/'+i.id+'/publish',{method:'POST'});say('Отправлено на модерацию');e.target.reset();go('my')}catch(x){say(x.message)}}
async function loadMy(){try{$('my-list').innerHTML=(await api('/me/items')).map(i=>`<div class="panel flex justify-between"><span><b>${esc(i.title)}</b><br><small>${esc(i.publication_status)}</small></span><button class="text-brand-700" onclick="showItem('${i.id}')">Открыть</button></div>`).join('')||'<p class="muted">Объявлений пока нет.</p>'}catch(e){say(e.message)}}async function favorite(i){try{await api('/items/'+i+'/favorite',{method:'PUT'});say('Добавлено в избранное')}catch(e){say(e.message)}}async function loadFavorites(){try{$('favorites-grid').innerHTML=(await api('/me/favorites')).map(card).join('')||'<p class="muted">Список пуст.</p>'}catch(e){say(e.message)}}
async function requestItem(){if(!S.user)return openAuth();let m=prompt('Сообщение владельцу:');if(m===null)return;try{await api('/items/'+S.item.id+'/requests',{method:'POST',body:JSON.stringify({message:m})});say('Заявка отправлена');go('requests')}catch(e){say(e.message)}}async function loadRequests(){try{let a=await api('/me/requests');$('requests-list').innerHTML=a.map(r=>`<div class="panel flex flex-wrap justify-between gap-3"><span><b>Заявка #${r.id}</b><br><small>${esc(r.status)} · ${esc(r.message)}</small></span><span><button class="secondary" onclick="chat(${r.id})">Чат</button>${r.owner_id===S.user.id&&r.status==='discussing'?`<button class="secondary" onclick="status(${r.id},'agreed')">Согласовать</button>`:''}${r.owner_id===S.user.id&&r.status==='agreed'?`<button class="primary" onclick="status(${r.id},'completed')">Сделка состоялась</button>`:''}</span></div>`).join('')||'<p class="muted">Заявок нет.</p>'}catch(e){say(e.message)}}async function status(i,s){try{await api('/requests/'+i+'/status',{method:'PATCH',body:JSON.stringify({status:s})});loadRequests()}catch(e){say(e.message)}}async function chat(i){S.request=i;$('chat-modal').classList.remove('hidden');messages()}async function messages(){try{let a=await api('/requests/'+S.request+'/messages');$('messages').innerHTML=a.map(x=>`<div class="${x.sender_id===S.user.id?'mine':''} message">${esc(x.body)}</div>`).join('')}catch(e){say(e.message)}}async function sendMessage(e){e.preventDefault();try{await api('/requests/'+S.request+'/messages',{method:'POST',body:JSON.stringify({body:$('message').value})});$('message').value='';messages()}catch(x){say(x.message)}}
async function loadModeration(){try{let a=await api('/admin/items/pending');$('moderation-list').innerHTML=a.map(i=>`<div class="panel flex justify-between"><span><b>${esc(i.title)}</b><br><small>${esc(i.owner.name)}</small></span><span><button class="primary" onclick="moderate('${i.id}','published')">Одобрить</button><button class="secondary" onclick="moderate('${i.id}','blocked')">Отклонить</button></span></div>`).join('')||'<p class="muted">Очередь пуста.</p>'}catch(e){say(e.message)}}async function moderate(i,s){try{await api('/admin/items/'+i+'/moderation',{method:'PATCH',body:JSON.stringify({status:s,reason:'Решение модератора'})});loadModeration();say('Готово')}catch(e){say(e.message)}}
function openAuth(){S.mode='login';authMode('login');$('auth-modal').classList.remove('hidden')}function closeModal(i){$(i).classList.add('hidden')}function authMode(m){S.mode=m;$('name').classList.toggle('hidden',m==='login');$('name').required=m==='register'}async function submitAuth(e){e.preventDefault();try{let r=await api('/auth/'+S.mode,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});S.token=localStorage.token=r.access_token;await hydrate();closeModal('auth-modal');say('Добро пожаловать')}catch(x){say(x.message)}}async function hydrate(){if(!S.token)return;try{S.user=await api('/me');$('auth').textContent='Выйти';$('auth').onclick=()=>{delete localStorage.token;location.reload()};$('user').textContent=S.user.name+' · '+S.user.role;document.querySelectorAll('.logged').forEach(x=>x.classList.remove('hidden'));$('add').classList.remove('hidden');if(S.user.role==='admin')$('admin-nav').classList.remove('hidden')}catch(e){delete localStorage.token}}loadCatalog();hydrate();
</script></body></html>
