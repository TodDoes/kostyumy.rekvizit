services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: costumes
      POSTGRES_USER: costumes
      POSTGRES_PASSWORD: costumes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costumes -d costumes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://costumes:costumes@db:5432/costumes
      JWT_SECRET: change-me-before-production
      APP_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
